<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="우리가 만드는 디지털 과학책 · 1~5차시 여정">
<meta property="og:description" content="기획에서 북 페어까지, 다섯 차시의 여정 · 송례중학교 3학년">
<meta property="og:image" content="poster.jpg">
<title>우리가 만드는 디지털 과학책 · 1~5차시 여정 영상</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root{--navy:#1b1c45;--navy2:#111230;--ink:#fff;--mute:#aaacd2;--c1:#3b4fb8;--c2:#e0473a;--c3:#1e9a6e;--c4:#f2b705;--c5:#6050be}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px;display:grid;gap:18px}
.top{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;font-weight:700;flex-wrap:wrap}
.dots{display:inline-flex}.dots i{width:14px;height:14px;border-radius:50%;display:block}.dots i+i{margin-left:-5px}
h1{margin:0;font-weight:900;font-size:clamp(28px,5vw,48px);letter-spacing:-.02em;line-height:1.15}
.sub{margin:0;color:var(--mute);font-size:15px;font-weight:500}
.sub b{color:var(--c4);font-weight:700}
.player{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.player video.hide{visibility:hidden}
.big{position:absolute;inset:0;margin:auto;width:92px;height:92px;border-radius:50%;border:0;background:rgba(242,183,5,.95);color:var(--navy);cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.big svg{width:40px;height:40px;margin-left:6px}
.big.off{display:none}
.bar{display:flex;align-items:center;gap:12px;background:var(--navy2);border-radius:14px;padding:10px 14px}
.btn{background:none;border:0;color:#fff;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;flex:none}
.btn:hover{background:rgba(255,255,255,.08)}
.btn svg{width:22px;height:22px}
.track{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none}
.rail{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:#2e3070;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5))}
.knob{position:absolute;top:8px;width:14px;height:14px;border-radius:50%;background:#fff;margin-left:-7px;left:0}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);font-weight:700;flex:none;min-width:86px;text-align:right}
.chap{display:flex;flex-wrap:wrap;gap:8px}
.chap button{border:2px solid #34367a;background:transparent;color:#d8d9f2;border-radius:999px;padding:7px 14px;font:700 14px "Noto Sans KR",sans-serif;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chap button i{width:10px;height:10px;border-radius:50%;display:block}
.chap button.on{background:#fff;color:var(--navy);border-color:#fff}
.credit{border-top:1px solid #2e3070;padding-top:16px;display:grid;gap:6px;font-size:14px;color:var(--mute)}
.credit b{color:#fff}
.devs{white-space:nowrap;font-size:clamp(10.5px,3.45vw,14px)}
.devs .tag{font-size:.85em;padding:2px 8px;margin-right:6px}
.tag{display:inline-block;background:var(--c4);color:var(--navy);border-radius:999px;padding:2px 10px;font-weight:900;font-size:12px;margin-right:8px}
.stripe{height:6px;display:flex}.stripe span{flex:1}
@media (max-width:560px){.time{min-width:70px;font-size:12px}.chap button{font-size:13px;padding:6px 11px}}
</style>
</head>
<body>
<div class="stripe"><span style="background:var(--c1)"></span><span style="background:var(--c2)"></span><span style="background:var(--c3)"></span><span style="background:var(--c4)"></span><span style="background:var(--c5)"></span></div>
<main class="wrap">
  <div class="top"><span class="dots"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i></span>첨단과학기술 기반 과학탐구 교수학습자료 개발</div>
  <h1>우리가 만드는 디지털 과학책</h1>
  <p class="sub">기획에서 북 페어까지, 다섯 차시의 여정 · <b>2분 28초</b></p>

  <div class="player"><video id="v" controls playsinline preload="metadata" poster="poster.jpg" src="journey.mp4"></video></div>

  <div class="chap" id="chap"></div>

  <div class="credit">
    <div class="devs"><span class="tag">개발교사</span><b>김희진</b> (개포중) · <b>조승호</b> (거원중) · <b>이정연</b> (송례중)</div>
  </div>
</main>
<script>
const v=document.getElementById('v');
const CH=[['오프닝',0,'#fff'],['1 기획',15,'var(--c1)'],['2 집필',29,'var(--c2)'],['3 편집과 교정',56,'var(--c3)'],['4 출간',78,'var(--c4)'],['5 북 페어',127.5,'var(--c5)'],['엔딩',138,'#fff']];
const ch=document.getElementById('chap');
CH.forEach(c=>{const b=document.createElement('button');b.innerHTML='<i style="background:'+c[2]+'"></i>'+c[0];b.onclick=()=>{v.currentTime=c[1];v.play().catch(()=>{})};ch.appendChild(b)});
v.addEventListener('timeupdate',()=>{let k=0;CH.forEach((c,i)=>{if(v.currentTime>=c[1]-0.05)k=i});ch.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===k))});
</script>
</body>
</html>
